name: Keep Streamlit App Awake

on:
  schedule:
    # Jalankan setiap 6 jam agar aplikasi tidak masuk mode sleep
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Visit and wake Streamlit app
        env:
          STREAMLIT_URL: "https://clustering-ulasan-bank-jago.streamlit.app/"
        run: |
          python - <<'EOF'
          import os
          import sys
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          url = os.environ["STREAMLIT_URL"]
          print(f"Membuka: {url}")

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)

                  # Jika aplikasi sedang sleep, klik tombol wake up bawaan Streamlit Cloud
                  wake_btn = page.get_by_role("button", name="Yes, get this app back up!")
                  try:
                      if wake_btn.is_visible(timeout=8000):
                          print("Aplikasi dalam kondisi sleep. Mengklik tombol wake up...")
                          wake_btn.click()
                  except PlaywrightTimeoutError:
                      pass

                  # Tunggu container utama Streamlit termuat (menjaga sesi WebSocket aktif)
                  page.wait_for_selector('[data-testid="stAppViewContainer"]', timeout=120000)
                  print("Aplikasi aktif. Judul halaman:", page.title())
                  browser.close()
          except Exception as exc:
              print(f"Gagal mengakses aplikasi Streamlit: {exc}", file=sys.stderr)
              sys.exit(1)
          EOF
