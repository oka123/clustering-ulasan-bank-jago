name: Keep Streamlit App Awake

on:
  schedule:
    # Jalankan setiap 6 jam agar aplikasi tidak masuk mode sleep
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Visit and wake Streamlit app
        env:
          STREAMLIT_URL: "https://clustering-ulasan-bank-jago.streamlit.app/"
        run: |
          python - <<'EOF'
          import os
          import re
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_URL"]
          print(f"Membuka: {url}")

          def find_and_click_wake_button(page):
              """Cari dan klik tombol wake up pada page utama maupun di dalam iframe."""
              for frame in page.frames:
                  try:
                      btn = frame.get_by_role(
                          "button", name=re.compile(r"get this app back up", re.I)
                      )
                      if btn.count() > 0 and btn.first.is_visible():
                          print("Aplikasi dalam kondisi sleep. Mengklik tombol wake up...")
                          btn.first.click()
                          return True
                  except Exception:
                      continue
              return False

          def is_app_loaded(page):
              """Cek apakah container utama Streamlit sudah termuat di page atau iframe."""
              for frame in page.frames:
                  try:
                      loc = frame.locator('[data-testid="stAppViewContainer"], [data-testid="stApp"]')
                      if loc.count() > 0 and loc.first.is_visible():
                          return True
                  except Exception:
                      continue
              return False

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)

                  deadline = time.time() + 180
                  clicked_wake = False

                  while time.time() < deadline:
                      if not clicked_wake:
                          clicked_wake = find_and_click_wake_button(page)

                      if is_app_loaded(page):
                          print("Aplikasi aktif. Judul halaman:", page.title())
                          # Tunggu singkat agar koneksi WebSocket stabil
                          time.sleep(3)
                          browser.close()
                          sys.exit(0)

                      time.sleep(2)

                  # Logging diagnostik jika timeout tercapai
                  print(
                      f"Timeout menunggu aplikasi. URL akhir: {page.url}, jumlah frame: {len(page.frames)}",
                      file=sys.stderr,
                  )
                  for idx, frame in enumerate(page.frames):
                      try:
                          snippet = frame.inner_text("body")[:300].replace("\n", " ")
                          print(f"Frame[{idx}] ({frame.url}): {snippet}", file=sys.stderr)
                      except Exception:
                          pass
                  browser.close()
                  sys.exit(1)
          except Exception as exc:
              print(f"Gagal mengakses aplikasi Streamlit: {exc}", file=sys.stderr)
              sys.exit(1)
          EOF
